# CodeRabbit 리뷰 설정
# 레퍼런스: https://docs.coderabbit.ai/reference/configuration

# 리뷰 코멘트를 한국어로. 번역해서 읽으면 대충 읽게 된다
language: "ko-KR"

# 리뷰 기준을 이 레포 규약에 맞춘다 (250자 제한)
tone_instructions: "이 레포 규약을 기준으로 본다. 커밋·PR은 docs/03-git.md(Conventional Commits, type 9종, scope 7종), import 경계는 docs/02-folder-structure.md(feature 내부 직접 import 금지, @ondo/ui는 @ondo/api 미참조). 칭찬은 생략하고 문제와 근거만 적는다."

chat:
  # ASCII 아트 끄기 — 리뷰 본문이 길어질 뿐이다
  art: false

reviews:
  # quiet | chill | assertive
  # chill 유지: 도구가 어느 정도로 지적하는지 감을 잡기 전에 조이지 않는다
  profile: "chill"

  # 변경 요약은 나중에 PR을 되짚을 때 실제로 쓸모가 있다
  high_level_summary: true

  finishing_touches:
    # 테스트도 docstring 규약도 아직 없다. 눌러도 쓸모가 없고 선택지만 늘린다
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    # 구현은 사람이 한다 (docs/03-git.md). 버튼이 있으면 언젠가 누른다
    autofix:
      enabled: false

  path_filters:
    # 코드젠 산출물 — 사람이 쓰지 않는 코드를 리뷰받을 이유가 없다
    - "!packages/api/src/generated/**"
