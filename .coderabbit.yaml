# CodeRabbit 리뷰 설정
# 레퍼런스: https://docs.coderabbit.ai/reference/configuration

# 리뷰 코멘트를 한국어로. 번역해서 읽으면 대충 읽게 된다
language: "ko-KR"

# 리뷰 기준을 이 레포 규약에 맞춘다 (250자 제한)
tone_instructions: "이 레포 규약을 기준으로 본다. 커밋·PR은 docs/03-git.md(Conventional Commits, type 9종, scope 7종), import 경계는 docs/02-folder-structure.md(feature 내부 직접 import 금지, @ondo/ui는 @ondo/api 미참조). 칭찬은 생략하고 문제와 근거만 적는다."

chat:
  # ASCII 아트 끄기
  art: false

reviews:
  # quiet | chill | assertive
  # chill 유지 — 아래에서 끄는 건 "장식"이지 "지적"이 아니다.
  # 지적 자체가 많다고 느껴지면 그때 quiet로 내린다
  profile: "chill"

  # ── 본문을 짧게: 읽지 않는 섹션을 끈다 ──────────────────
  # 변경 요약. diff를 보면 되고, PR 본문에 이미 적는다
  high_level_summary: false
  # 파일별 요약 표. 길이의 대부분을 차지한다
  changed_files_summary: false
  # 시퀀스 다이어그램. 설정 파일에는 의미가 없다
  sequence_diagrams: false
  # "리뷰 난이도 추정". 판단에 쓰이지 않는다
  estimate_code_review_effort: false
  # 관련 이슈·PR 추측. 근거가 약하고 본문만 늘린다
  related_issues: false
  related_prs: false
  # 라벨·리뷰어 제안. 1인 FE라 리뷰어 제안은 특히 무의미하다
  suggested_labels: false
  suggested_reviewers: false
  # "지금 처리 중입니다" 중간 코멘트. 완료된 리뷰만 보면 된다
  review_progress: false
  poem: false

  # ── 남기는 것 ────────────────────────────────────────
  # 링크된 이슈와 PR 내용이 어긋나면 잡아준다.
  # #16에서 실제로 낡은 이슈 본문을 잡아냈다
  assess_linked_issues: true
  # 리뷰를 건너뛴 경우 그 사유를 남긴다. 없으면 침묵과 구분이 안 된다
  review_status: true
  # PR checks 목록에 리뷰 완료 여부를 띄운다 (코멘트 길이와 무관)
  commit_status: true

  finishing_touches:
    # 테스트도 docstring 규약도 아직 없다
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    # 구현은 사람이 한다 (docs/03-git.md). 버튼이 있으면 언젠가 누른다
    autofix:
      enabled: false

  path_filters:
    # 코드젠 산출물 — 사람이 쓰지 않는 코드를 리뷰받을 이유가 없다
    - "!packages/api/src/generated/**"
